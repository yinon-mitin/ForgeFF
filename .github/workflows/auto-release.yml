name: Automatic Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, build, and publish
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate repository
        run: |
          set -euo pipefail
          git diff --check
          bash -n script/*.sh scripts/*.sh
          xmllint --noout docs/forgeff-banner.svg

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild \
            -project ForgeFF.xcodeproj \
            -scheme ForgeFF \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ForgeFF-TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Calculate next patch version
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            > "$RUNNER_TEMP/latest-release.json"

          python3 - "$RUNNER_TEMP/latest-release.json" <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          project = Path("ForgeFF.xcodeproj/project.pbxproj")
          text = project.read_text()
          match = re.search(r"MARKETING_VERSION = ([0-9]+[.][0-9]+[.][0-9]+);", text)
          if not match:
              raise SystemExit("MARKETING_VERSION was not found")

          def version(value):
              return tuple(int(part) for part in value.split("."))

          current = match.group(1)
          latest_payload = json.loads(Path(os.sys.argv[1]).read_text())
          latest_tag = latest_payload.get("tag_name", "0.0.0").removeprefix("v")
          latest_match = re.fullmatch(r"[0-9]+[.][0-9]+[.][0-9]+", latest_tag)
          latest = latest_tag if latest_match else "0.0.0"
          base = max(version(current), version(latest))
          next_version = f"{base[0]}.{base[1]}.{base[2] + 1}"
          build_matches = re.findall(r"CURRENT_PROJECT_VERSION = ([0-9]+);", text)
          if not build_matches:
              raise SystemExit("CURRENT_PROJECT_VERSION was not found")
          next_build = str(max(int(value) for value in build_matches) + 1)

          text = re.sub(r"MARKETING_VERSION = [0-9]+[.][0-9]+[.][0-9]+;", f"MARKETING_VERSION = {next_version};", text)
          text = re.sub(r"CURRENT_PROJECT_VERSION = [0-9]+;", f"CURRENT_PROJECT_VERSION = {next_build};", text)
          project.write_text(text)

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text()
          marker = "## [Unreleased]"
          if marker in changelog_text and f"## [{next_version}]" not in changelog_text:
              changelog_text = changelog_text.replace(
                  marker,
                  f"{marker}\n\n## [{next_version}] - {__import__('datetime').date.today().isoformat()}\n\n- Automated release from main.",
                  1,
              )
              changelog.write_text(changelog_text)

          env = Path(os.environ["GITHUB_ENV"])
          with env.open("a") as output:
              output.write(f"RELEASE_VERSION={next_version}\n")
              output.write(f"TAG_NAME=v{next_version}\n")
              output.write(f"NEXT_BUILD={next_build}\n")
          print(f"Preparing {next_version} (build {next_build})")
          PY

      - name: Commit version and push main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ForgeFF.xcodeproj/project.pbxproj CHANGELOG.md
          git commit -m "chore(release): prepare ${TAG_NAME} [skip release]"
          git push origin HEAD:main
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build universal Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ForgeFF.xcodeproj \
            -scheme ForgeFF \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ForgeFF-ReleaseDerivedData" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Sign and verify app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ForgeFF-ReleaseDerivedData/Build/Products/Release/ForgeFF.app"
          codesign --force --deep --sign - --timestamp=none --options runtime \
            --entitlements ForgeFF/ForgeFF.entitlements "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package release
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ForgeFF-ReleaseDerivedData/Build/Products/Release/ForgeFF.app"
          ZIP_PATH="$RUNNER_TEMP/ForgeFF-${RELEASE_VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" > "$ZIP_PATH.sha256"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ env.RELEASE_COMMIT }}
          name: ForgeFF ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.ZIP_PATH }}.sha256
          fail_on_unmatched_files: true
