name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-14
    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare release paths
        run: |
          set -euo pipefail

          RELEASE_VERSION="${TAG_NAME#v}"
          RELEASE_ASSET_BASENAME="ForgeFF-${RELEASE_VERSION}-macOS"
          ZIP_NAME="${RELEASE_ASSET_BASENAME}.zip"

          {
            echo "RELEASE_VERSION=${RELEASE_VERSION}"
            echo "RELEASE_ASSET_BASENAME=${RELEASE_ASSET_BASENAME}"
            echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/ForgeFF-DerivedData"
            echo "ZIP_PATH=${RUNNER_TEMP}/${ZIP_NAME}"
            echo "SHA_PATH=${RUNNER_TEMP}/${ZIP_NAME}.sha256"
          } >> "${GITHUB_ENV}"

      - name: Validate tag matches project version
        run: |
          set -euo pipefail

          PROJECT_VERSION="$({
            xcodebuild \
              -project ForgeFF.xcodeproj \
              -scheme ForgeFF \
              -configuration Release \
              -showBuildSettings
          } | awk -F ' = ' '/MARKETING_VERSION =/ { print $2; exit }')"

          if [ "${PROJECT_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match MARKETING_VERSION ${PROJECT_VERSION}"
            exit 1
          fi

      - name: Test
        run: |
          set -euo pipefail

          xcodebuild \
            -project ForgeFF.xcodeproj \
            -scheme ForgeFF \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Build universal Release app
        run: |
          set -euo pipefail

          xcodebuild \
            -project ForgeFF.xcodeproj \
            -scheme ForgeFF \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Apply ad-hoc signature
        run: |
          set -euo pipefail

          APP_PATH="${DERIVED_DATA_PATH}/Build/Products/Release/ForgeFF.app"
          test -d "${APP_PATH}"
          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            --options runtime \
            --entitlements ForgeFF/ForgeFF.entitlements \
            "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

      - name: Package release archive and checksum
        run: |
          set -euo pipefail

          APP_PATH="${DERIVED_DATA_PATH}/Build/Products/Release/ForgeFF.app"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ZIP_PATH}"
          cd "$(dirname "${ZIP_PATH}")"
          shasum -a 256 "$(basename "${ZIP_PATH}")" > "$(basename "${SHA_PATH}")"

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/${{ env.RELEASE_ASSET_BASENAME }}.zip
            ${{ runner.temp }}/${{ env.RELEASE_ASSET_BASENAME }}.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
