<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ForgeFF app icon</title>
  <desc id="desc">A dark cinematic ForgeFF icon with a coral-orange forged play symbol and media waveform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202431"/>
      <stop offset="0.55" stop-color="#171a24"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb45c"/>
      <stop offset="1" stop-color="#f26b4f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb45c"/>
      <stop offset="1" stop-color="#ef6b78"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="238" fill="url(#bg)"/>
  <circle cx="790" cy="220" r="270" fill="#f26b4f" opacity=".15" filter="url(#blur)"/>
  <circle cx="180" cy="860" r="260" fill="#5d72ff" opacity=".10" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <rect x="92" y="92" width="840" height="840" rx="190" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="4"/>
    <rect x="126" y="126" width="772" height="772" rx="164" fill="none" stroke="url(#glow)" stroke-opacity=".38" stroke-width="7"/>
    <circle cx="512" cy="488" r="326" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="4"/>
    <path d="M366 270 L700 488 L366 706 Z" fill="url(#glow)"/>
    <path d="M236 488 H338 M686 488 H788" stroke="#fff" stroke-opacity=".82" stroke-width="22" stroke-linecap="round"/>
    <path d="M250 397 V579 M296 350 V626 M728 350 V626 M774 397 V579" stroke="#fff" stroke-opacity=".62" stroke-width="18" stroke-linecap="round"/>
    <path d="M214 788 C260 788 260 744 306 744 S352 832 398 832 S444 760 490 760 S536 814 582 814 S628 740 674 740 S720 792 766 792 S812 766 858 766" fill="none" stroke="url(#wave)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="858" cy="766" r="17" fill="#ffb45c"/>
  </g>
</svg>
